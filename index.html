<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Spare Part Inventory</title>
<meta name="description" content="Inventario de repuestos industriales — 100% offline" />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />

<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SparePart" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icons/favicon.png" />

<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app" class="app">

  <!-- Top bar -->
  <header class="topbar">
    <button id="btn-sidebar-toggle" class="icon-btn only-desktop" aria-label="Alternar menú" data-icon="menu"></button>
    <div class="topbar-title">
      <span class="topbar-brand" id="topbar-company">Spare Part Inventory</span>
      <span class="topbar-page" id="topbar-page">Inicio</span>
    </div>
    <button id="btn-theme-toggle" class="icon-btn" aria-label="Cambiar tema" data-icon="theme"></button>
  </header>

  <div class="app-body">
    <!-- Desktop sidebar -->
    <nav class="sidebar" id="sidebar" aria-label="Navegación principal">
      <div class="sidebar-list" id="sidebar-list"></div>
    </nav>

    <!-- Main view -->
    <main id="view-root" class="view-root" tabindex="-1"></main>
  </div>

  <!-- Mobile bottom nav -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="Navegación inferior"></nav>

  <!-- "More" slide-up sheet (mobile) -->
  <div id="more-sheet-backdrop" class="sheet-backdrop" hidden></div>
  <div id="more-sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="Más opciones">
    <div class="sheet-handle"></div>
    <div class="sheet-list" id="more-sheet-list"></div>
  </div>

  <!-- Generic modal root -->
  <div id="modal-root"></div>

  <!-- Toast root -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- Print / PDF overlay root -->
  <div id="print-root"></div>

</div>

<script src="vendor/xlsx.full.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
